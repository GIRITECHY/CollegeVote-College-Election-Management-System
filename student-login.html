<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login — CollegeVote</title>
    <meta name="description" content="Student authentication portal for the College Election Management System.">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/index.html" class="navbar-brand">
                <span>🗳️</span> CollegeVote
            </a>
            <div class="navbar-nav">
                <a href="/index.html">Home</a>
                <a href="/admin-login.html">Admin Portal</a>
            </div>
        </div>
    </nav>

    <main class="page-content">
        <div class="container">
            <div class="login-container">
                <div class="login-card">
                    <h2>Student Portal</h2>
                    <p class="login-subtitle">Sign in with your Student ID to cast your vote</p>

                    <div id="login-message"></div>

                    <form id="student-login-form">
                        <div class="form-group">
                            <label for="student-id">Student ID</label>
                            <input type="text" id="student-id" class="form-control" placeholder="e.g. STU001" required autocomplete="username">
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
                            Sign In & Vote
                        </button>
                    </form>

                    <div class="card" style="margin-top: 24px; background: var(--bg-gray); border-color: var(--border);">
                        <div class="card-body" style="padding: 14px; font-size: 0.8rem;">
                            <strong>Demo Student Credentials:</strong>
                            <div style="margin-top: 4px; color: var(--text-secondary);">
                                ID: <code style="background: white; padding: 2px 4px; border-radius: 3px;">STU001</code> (or STU002 - STU005)<br>
                                Password: <code style="background: white; padding: 2px 4px; border-radius: 3px;">student123</code>
                            </div>
                        </div>
                    </div>

                    <p style="text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-secondary);">
                        Are you an administrator? <a href="/admin-login.html">Admin Login</a>
                    </p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>CollegeVote &copy; 2026. Secure Student Voting.</p>
        </div>
    </footer>

    <script src="/js/common.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', initStudentLogin);
    </script>
</body>
</html>
